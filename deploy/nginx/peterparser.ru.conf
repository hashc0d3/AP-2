# Reverse proxy для parser1 → https://peterparser.ru
# Установка: /opt/infra-proxy/conf.d/40-peterparser.ru.conf (infra-nginx)

# HTTP → HTTPS (www → apex)
server {
    listen 80;
    listen [::]:80;
    server_name peterparser.ru www.peterparser.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://peterparser.ru$request_uri;
    }
}

# www → apex (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.peterparser.ru;

    ssl_certificate     /etc/letsencrypt/live/peterparser.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peterparser.ru/privkey.pem;

    return 301 https://peterparser.ru$request_uri;
}

# Основной vhost
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name peterparser.ru;

    ssl_certificate     /etc/letsencrypt/live/peterparser.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peterparser.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }
}
