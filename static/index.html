<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avito — новые объявления</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --line: #2a3542;
      --text: #e8eef5;
      --muted: #8b9bb0;
      --price: #7dffa3;
      --call: #16a34a;
      --link: #3b82f6;
      --new: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      background: rgba(15, 20, 25, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0; font-size: 18px; font-weight: 650; }
    .status { color: var(--muted); font-size: 13px; }
    .status.live::before {
      content: "";
      display: inline-block;
      width: 8px; height: 8px;
      margin-right: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 14px;
    }
    .empty { color: var(--muted); text-align: center; padding: 60px 16px; line-height: 1.5; }
    .card {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      animation: in .35s ease;
    }
    .card.fresh { outline: 1px solid var(--new); }
    @keyframes in {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: none; }
    }
    .gallery {
      position: relative;
      background: #0b0f13;
      min-height: 180px;
    }
    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .gallery .ph {
      height: 200px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
    }
    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 28px; height: 28px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      cursor: pointer;
    }
    .nav.prev { left: 8px; }
    .nav.next { right: 8px; }
    .body { padding: 12px 14px 14px 0; display: flex; flex-direction: column; gap: 8px; }
    .price { color: var(--price); font-size: 22px; font-weight: 700; }
    .title { font-size: 16px; line-height: 1.3; }
    .addr { color: var(--muted); font-size: 13px; }
    .seller { color: var(--muted); font-size: 13px; }
    .phone {
      color: #22c55e;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .card.callable {
      border-color: #16a34a;
      box-shadow: 0 0 0 1px #16a34a66;
    }
    .btn.call.muted { opacity: 0.5; }
    .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 650;
      font-size: 14px;
      color: #fff;
    }
    .btn.call { background: var(--call); }
    .btn.open { background: var(--link); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .btn.reset {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      cursor: pointer;
    }
    .btn.reset:hover { border-color: #ef4444; color: #fecaca; }
    @media (max-width: 640px) {
      .card { grid-template-columns: 1fr; }
      .body { padding: 12px 14px 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>iPhone · новые за 15 мин</h1>
    <div class="header-right">
      <button class="btn reset" id="reset" type="button">Сбросить</button>
      <div class="status" id="status">подключение…</div>
    </div>
  </header>
  <main id="feed"><div class="empty">Жду объявления за последние 15 минут…</div></main>
  <script>
    const feed = document.getElementById("feed");
    const statusEl = document.getElementById("status");
    const seen = new Set();

    function imgSrc(url) {
      return "/img?u=" + encodeURIComponent(url);
    }

    function cardHtml(ad) {
      const images = ad.images || [];
      const gallery = images.length
        ? `<img src="${imgSrc(images[0])}" alt="" data-i="0" />
           ${images.length > 1 ? `<button class="nav prev" type="button">‹</button><button class="nav next" type="button">›</button>` : ""}`
        : `<div class="ph">нет фото</div>`;
      const callHref = ad.phone ? ("tel:" + ad.phone) : ad.url;
      const imagesAttr = encodeURIComponent(JSON.stringify(images));
      const phoneHtml = ad.phone
        ? `<a class="phone" href="tel:${escapeHtml(ad.phone)}">${escapeHtml(ad.phone)}</a>`
        : "";
      const sellerHtml = ad.seller ? `<div class="seller">${escapeHtml(ad.seller)}</div>` : "";
      return `<article class="card${ad.phone ? " callable" : ""}" data-id="${ad.id}">
        <div class="gallery" data-images="${imagesAttr}">${gallery}</div>
        <div class="body">
          <div class="price">${escapeHtml(ad.price || "")}</div>
          <div class="title">${escapeHtml(ad.title || "")}</div>
          <div class="addr">${escapeHtml(ad.published ? ad.published + " · " : "")}${escapeHtml(ad.address || "")}</div>
          ${sellerHtml}
          ${phoneHtml}
          <div class="actions">
            <a class="btn call${ad.phone ? "" : " muted"}" href="${callHref}" ${ad.phone ? "" : 'target="_blank" rel="noopener"'}>Позвонить</a>
            <a class="btn open" href="${ad.url}" target="_blank" rel="noopener">Открыть</a>
          </div>
        </div>
      </article>`;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function mount(ad, fresh) {
      if (seen.has(String(ad.id))) return null;
      seen.add(String(ad.id));
      const wrap = document.createElement("div");
      wrap.innerHTML = cardHtml(ad);
      const el = wrap.firstElementChild;
      if (fresh) el.classList.add("fresh");
      bindGallery(el);
      return el;
    }

    function bindGallery(card) {
      const box = card.querySelector(".gallery");
      let images = [];
      try { images = JSON.parse(decodeURIComponent(box.dataset.images || "%5B%5D")); } catch (e) { images = []; }
      if (images.length < 2) return;
      const img = box.querySelector("img");
      let i = 0;
      const show = () => { img.src = imgSrc(images[i]); img.dataset.i = String(i); };
      box.querySelector(".prev")?.addEventListener("click", () => { i = (i - 1 + images.length) % images.length; show(); });
      box.querySelector(".next")?.addEventListener("click", () => { i = (i + 1) % images.length; show(); });
    }

    function setStatus(text, live) {
      statusEl.textContent = text;
      statusEl.classList.toggle("live", live);
    }

    function addBatch(ads, fresh) {
      if (!Array.isArray(ads) || !ads.length) {
        if (!seen.size) setStatus("онлайн · жду объявления", true);
        return;
      }
      const empty = feed.querySelector(".empty");
      if (empty) empty.remove();
      const marker = feed.firstChild;
      ads.forEach((ad) => {
        const el = mount(ad, fresh);
        if (el) feed.insertBefore(el, marker);
      });
      setStatus("онлайн · " + seen.size + " объявл.", true);
    }

    function clearFeed() {
      seen.clear();
      feed.innerHTML = '<div class="empty">Жду объявления за последние 15 минут…</div>';
      setStatus("онлайн · 0 объявл.", true);
    }

    document.getElementById("reset").addEventListener("click", async () => {
      try {
        await fetch("/api/reset", { method: "POST" });
      } catch (e) {}
      clearFeed();
    });

    function loadAds() {
      return fetch("/api/ads")
        .then((r) => r.json())
        .then((ads) => addBatch(ads, false))
        .catch(() => {});
    }

    loadAds();
    setInterval(loadAds, 4000);

    let offlineTimer = null;
    const es = new EventSource("/events");
    es.onopen = () => {
      clearTimeout(offlineTimer);
      setStatus("онлайн · " + seen.size + " объявл.", true);
    };
    es.onerror = () => {
      clearTimeout(offlineTimer);
      offlineTimer = setTimeout(() => {
        if (es.readyState !== EventSource.OPEN) {
          setStatus("переподключение…", false);
        }
      }, 4000);
    };
    es.onmessage = (ev) => {
      try { addBatch(JSON.parse(ev.data), true); } catch (e) {}
    };
    es.addEventListener("reset", clearFeed);
  </script>
</body>
</html>
